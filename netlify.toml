# Netlify deployment — startups.co.ke
# Static Astro output; boards re-pull on every deploy (scripts/fetch_jobs.mjs via prebuild).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # repo ships a bun.lock; Netlify auto-detects it. Force npm for a fully
  # reproducible, lockfile-driven install even without bun on the build image:
  NETLIFY_USE_BUN = "false"

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    # Filenames are content-stable (normalize_logos.py); bump the name when a
    # logo actually changes. 1y immutable closes the PSI cache-lifetime finding.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------
# Founder-listed startups (community directory) — instant publish, no approval.
# Clean URLs are served by Netlify Functions v2 `config.path` route claims
# (see netlify/functions/startup-page.mjs + startup-list.mjs):
#   /startups/community/:slug     → startup-page (HTML or ?format=md)
#   /startups/community/list.json → startup-list (public JSON feed)
# NOTE: netlify.toml redirects are intentionally NOT used — Netlify rewrites
# do not forward placeholders from the path into the target query string, and
# the functions claim their routes natively instead.
# Listings live in Netlify Blobs (store community_startups). The functions set
# their own CDN cache headers (s-maxage=300 + stale-while-revalidate), so
# crawler bursts never reach storage.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Security headers (site-wide)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------------------------
# 404 (Netlify serves dist/404.html automatically for unmatched routes —
# Astro emits it; nothing to configure here.)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Legacy / guessed URLs → honest landings
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301
  force = false

[[redirects]]
  from = "/submit-listing"
  to = "/list-your-startup"
  status = 301
