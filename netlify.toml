# Netlify deployment — startups.co.ke
# Static Astro output; boards re-pull on every deploy (scripts/fetch_jobs.mjs via prebuild).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # repo ships a bun.lock; Netlify auto-detects it. Force npm for a fully
  # reproducible, lockfile-driven install even without bun on the build image:
  NETLIFY_USE_BUN = "false"

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Security headers (site-wide)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------------------------
# 404 (Netlify serves dist/404.html automatically for unmatched routes —
# Astro emits it; nothing to configure here.)
# ---------------------------------------------------------------------------
