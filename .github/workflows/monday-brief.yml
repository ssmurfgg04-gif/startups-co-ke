# Monday brief smoke test — validates the weekly release path
# Cron: Mon 06:00 EAT (03:00 UTC). No secrets needed for smoke test.
# If RESEND_API_KEY secret is set, emails a preview to the owner.
name: Monday brief smoke test

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: monday-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          node scripts/unit_s7.mjs
          node scripts/unit_s8.mjs
          node scripts/unit_logo.mjs
      - name: Jobs freshness check
        run: node scripts/fetch_jobs.mjs
      - name: Verify jobs snapshot
        run: test -f src/data/jobs.live.json
      - name: Events freshness check
        run: node scripts/fetch_events.mjs
      - name: Verify events snapshot
        run: test -f src/data/events.live.json
      - name: Brief draft exists
        run: test -f qa/drafts/brief-002.md
      - name: Brief module exists
        run: test -f worker/brief.mjs
      - name: Check no em dashes in brief
        run: |
          if grep -r -n "—" qa/drafts/brief-002.md worker/brief.mjs; then
            echo "FAIL em dash found"
            exit 1
          else
            echo "PASS no em dashes"
          fi
      - name: Word count
        run: wc -w qa/drafts/brief-002.md
      - name: Email owner preview if secret present
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESK_EMAIL: ${{ secrets.DESK_EMAIL }}
        run: node scripts/monday_preview.mjs
