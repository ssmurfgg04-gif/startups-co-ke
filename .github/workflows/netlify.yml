# Deploys the site to Netlify on every push to main.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN — Netlify personal access token (Applications → PAT)
#   NETLIFY_SITE_ID    — Site settings → API → Site ID
# If the secrets are absent the job skips itself — the repo stays green.

name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (live job boards re-pull here)
        run: npm run build

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          npx netlify-cli@latest deploy --prod --dir=dist \
            --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID" \
            --message "gh-actions $GITHUB_SHA"
